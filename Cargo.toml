[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# External crate versions are managed only here (guidelines section 13)
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.8", features = ["derive"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = "1"
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

# Workspace crates
db = { path = "crates/db" }
infra = { path = "crates/infra" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Groups: turn on stricter suggestions (priority -1 = applied before individual settings)
pedantic = { level = "warn", priority = -1 }
# Turn off only the pedantic lints that are noisy during early learning
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# No panic paths
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# No debug output (use tracing)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Lint exceptions are allowed only as #[expect(..., reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Integer and cast safety
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
