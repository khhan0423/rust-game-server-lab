[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# External crate versions are managed only here (guidelines section 13)
anyhow = "1.0.104"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bevy = { version = "0.20.1", default-features = false, features = ["std", "async_executor", "bevy_winit", "bevy_core_pipeline", "bevy_sprite_render", "keyboard", "mouse", "x11"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["default_fonts", "render"] }
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
hdrhistogram = { version = "7.6.0", default-features = false }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
prost = "0.14.6"
prost-build = "0.14.6"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = "1"
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.29.3", features = ["v7"] }

# Workspace crates
db = { path = "crates/db" }
infra = { path = "crates/infra" }
net = { path = "crates/net" }
protocol = { path = "crates/protocol" }
testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Groups: turn on stricter suggestions (priority -1 = applied before individual settings)
pedantic = { level = "warn", priority = -1 }
# Turn off only the pedantic lints that are noisy during early learning
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# No panic paths
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# No debug output (use tracing)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Lint exceptions are allowed only as #[expect(..., reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Integer and cast safety
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
