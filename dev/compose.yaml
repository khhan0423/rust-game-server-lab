# PostgreSQL and Valkey for the development PC. In production the DBs are separate, but in development they share one instance.
# Usage: docker compose --env-file .env -f dev/compose.yaml up -d --wait
name: gameserver-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs the quality gate on Linux. It does not start normally; it runs only with the command below.
  # docker compose --env-file .env -f dev/compose.yaml run --rm linux-gate
  linux-gate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: linux-gate.Dockerfile
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/postgres
      CARGO_TARGET_DIR: /target
    volumes:
      - ..:/workspace
      - rustup_home:/usr/local/rustup
      - cargo_home:/usr/local/cargo
      - linux_target:/target
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-c", "protoc --version && exec bash scripts/gate.sh"]

volumes:
  postgres_data:
  rustup_home:
  cargo_home:
  linux_target:
